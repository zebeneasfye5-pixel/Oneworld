    <!-- Instant native system typography (zero render-blocking external font requests) -->
    <style>
      /* Ensure base background is always dark and typography is thick, crisp and prominent */
      html, body {
        background-color: #0a0d14;
        color: #ffffff;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Ebrima", "Nyala", "Kefa", sans-serif;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.015em;
        line-height: 1.75;
        -webkit-tap-highlight-color: transparent;
        overflow-x: hidden;
        -webkit-font-smoothing: auto;
        font-synthesis-weight: auto;
      }
      @keyframes owSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-[#0a0d14] text-white selection:bg-amber-500 selection:text-slate-950">
    <div id="root">
      <!-- Instant Pre-render Shell with automatic stalled-cache recovery -->
      <div id="ow-boot-shell" style="min-height: 100vh; background-color: #0c0f17; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; color: #f8fafc;">
        <div id="ow-boot-spinner" style="width: 56px; height: 56px; border-radius: 50%; border: 3px solid rgba(245, 158, 11, 0.2); border-top-color: #f59e0b; animation: owSpin 0.7s linear infinite; margin-bottom: 20px;"></div>
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 10px;">
          <h1 style="font-size: 38px; font-weight: 900; letter-spacing: 0.01em; margin: 0; background: linear-gradient(to right, #fbbf24, #10b981, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Oneworld</h1>
        </div>
        <p id="ow-boot-msg" style="font-size: 18px; color: #ffffff; margin: 0 0 18px 0; font-weight: 700;">በከፍተኛ ፍጥነት በመከፈት ላይ... እባክዎ ይጠብቁ</p>
        <button id="ow-boot-retry" type="button" style="display: none; padding: 12px 24px; border-radius: 14px; border: 0; background: linear-gradient(to right, #f59e0b, #10b981); color: #0a0d14; font-weight: 800; font-size: 16px; cursor: pointer;">
          🔄 ዳግም ክፈት (Tap to Refresh)
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>

    <!-- Stale Cache Watchdog + Non-blocking Service Worker Registration -->
    <script>
      (function () {
        function purgeCachesAndReload(auto) {
          try {
            var tasks = [];
            if ('serviceWorker' in navigator) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
            if ('caches' in window) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
            Promise.all(tasks).finally(function () {
              if (auto) {
                var url = window.location.pathname + '?v=' + Date.now();
                window.location.replace(url);
              }
            });
          } catch (e) {
            if (auto) window.location.reload();
          }
        }

        // Watchdog: if React has not replaced #ow-boot-shell within 3.5s, recover cleanly
        setTimeout(function () {
          var shell = document.getElementById('ow-boot-shell');
          if (!shell) return;
          try {
            var retried = sessionStorage.getItem('ow_boot_retried');
            if (!retried) {
              sessionStorage.setItem('ow_boot_retried', '1');
              purgeCachesAndReload(true);
              return;
            }
          } catch (e) {}
          var msg = document.getElementById('ow-boot-msg');
          var btn = document.getElementById('ow-boot-retry');
          if (msg) msg.textContent = 'ኔትወርክ ዘግይቷል — ገጹን ለማደስ ከታች ይጫኑ';
          if (btn) {
            btn.style.display = 'inline-block';
            btn.onclick = function () { purgeCachesAndReload(true); };
          }
        }, 3500);

        window.addEventListener('load', function () {
          try { sessionStorage.removeItem('ow_boot_retried'); } catch (e) {}
          try {
            if ('serviceWorker' in navigator && window.isSecureContext) {
              navigator.serviceWorker.register('/sw.js', { scope: '/', updateViaCache: 'none' }).catch(function () {});
            }
          } catch (e) {}
        });
      })();
    </script>
  </body>
